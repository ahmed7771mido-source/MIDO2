{% extends "admin/base.html" %}
{% block content %}
<div class="bar">
    <h2>الطلبات</h2>
    <form method="get" class="inl"><input name="q" value="{{ q }}" placeholder="اسم أو تليفون">
        <select name="status" onchange="this.form.submit()">
            <option value="">كل الحالات</option>{% for k,l in STATUSES %}<option value="{{ k }}" {{ 'selected' if
                k==status }}>{% if k=='new' %}🔔{% elif k=='confirmed' %}✅{% elif k=='shipping' %}🚚{% elif
                k=='delivered' %}📦{% elif k=='cancelled' %}❌{% endif %} {{ l }}</option>{% endfor %}
        </select>
        <button class="btn s">بحث</button> <a class="btn s o" href="{{ url_for('admin.export_orders') }}">تصدير
            Excel</a>
    </form>
</div>
<div class="card scroll">
    <table>
        <tr>
            <th>#</th>
            <th>التاريخ</th>
            <th>العميل</th>
            <th>التليفون</th>
            <th>الإجمالي</th>
            <th>الحالة</th>
            <th>إجراءات</th>
        </tr>
        {% for o in orders %}<tr class="{{ '' if o.seen else 'unseen' }}">
            <td><a href="{{ url_for('admin.order_detail', oid=o.id) }}">#{{ o.id }}</a></td>
            <td>{{ o.created_at|dt }}</td>
            <td>{{ o.name }}</td>
            <td>{{ o.phone }}</td>
            <td>{{ o.total|money }}</td>
            <td><span class="st {{ o.status }}">{{ o.status_label }}</span></td>
            <td class="actions">
                <form method="post" action="{{ url_for('admin.order_quick_action', oid=o.id) }}" style="display:inline">
                    <input type="hidden" name="csrf" value="{{ csrf }}">
                    <button type="submit" name="action" value="delivered" class="act-btn delivered" title="تم التسليم"
                        {% if o.status=='delivered' %}disabled{% endif %}>✅</button>
                    <button type="submit" name="action" value="cancelled" class="act-btn cancelled" title="إلغاء/مرتجع"
                        {% if o.status=='cancelled' %}disabled{% endif %}>❌</button>
                    <button type="submit" name="action" value="delete" class="act-btn delete" title="حذف نهائي"
                        onclick="return confirm('متأكد من حذف الطلب #{{ o.id }} نهائياً؟')">🗑️</button>
                </form>
            </td>
        </tr>
        {% else %}<tr>
            <td colspan="7" class="mut">مفيش طلبات.</td>
        </tr>{% endfor %}
    </table>
</div>
{% endblock %}
